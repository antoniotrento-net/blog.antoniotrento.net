<!DOCTYPE html>
<html lang="{{ page.lang | default: site.default_lang }}" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    {% include seo.html %}
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        display: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#202124',
                            blue: '#4285F4',
                            red: '#EA4335',
                            yellow: '#FBBC04',
                            green: '#34A853',
                            gray: '#F1F3F4',
                            surface: '#F8F9FA',
                            dark: '#171717',
                            darkbg: '#0a0a0a',
                            darksurface: '#171717'
                        }
                    },
                    borderRadius: {
                        'pill': '9999px',
                        'xl': '1.5rem',
                        '2xl': '2rem',
                        '3xl': '3rem',
                        '4xl': '4rem',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 48s linear infinite',
                    },
                }
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        @keyframes heroKen {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.08) translate(-1.5%, 1%); }
            100% { transform: scale(1) translate(0, 0); }
        }
        .hero-kenburns { animation: heroKen 18s ease-in-out infinite; }

        @keyframes heroBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(4%, -6%) scale(1.08); }
            66% { transform: translate(-5%, 4%) scale(0.94); }
        }
        .hero-blob { animation: heroBlob 18s ease-in-out infinite; }
        .hero-blob-delay { animation-delay: -6s; }
        .hero-blob-delay-2 { animation-delay: -12s; }

        @keyframes heroMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .hero-marquee { animation: heroMarquee 38s linear infinite; }

        @keyframes heroShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hero-shimmer {
            background-size: 200% 200%;
            animation: heroShimmer 8s ease infinite;
        }

        @keyframes heroScroll {
            0%, 100% { opacity: 0.2; transform: scaleY(0.6); }
            50% { opacity: 1; transform: scaleY(1); }
        }
        .hero-scroll-line { transform-origin: top; animation: heroScroll 1.8s ease-in-out infinite; }

        .hero-grid {
            background-image:
                linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }
        .hero-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            opacity: 0.18;
            mix-blend-mode: overlay;
        }
        .hero-card-float { animation: float 7s ease-in-out infinite; }
        .hero-card:nth-child(even) .hero-card-float { animation-delay: -3.5s; }

        @media (prefers-reduced-motion: reduce) {
            .hero-kenburns, .hero-blob, .hero-marquee, .hero-shimmer, .hero-scroll-line,
            .animate-float, .animate-float-delayed, .animate-ping, .hero-card-float {
                animation: none !important;
            }
            .hero-stack-3d { transform: none !important; }
        }

        /* Article body links → brand blue (blends with main site) */
        .prose a { color: #4285F4; text-decoration: none; font-weight: 500; }
        .prose a:hover { text-decoration: underline; }
        .dark .prose a { color: #8ab4f8; }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>

<body
    class="overflow-x-hidden selection:bg-brand-blue selection:text-white bg-white dark:bg-neutral-950 text-brand-black dark:text-white transition-colors duration-300">

    {% include antigravity_nav.html %}

    {{ content }}

    {% include antigravity_footer.html %}

    <script src="{{ '/assets/js/antigravity.js' | relative_url }}"></script>
</body>

</html>
