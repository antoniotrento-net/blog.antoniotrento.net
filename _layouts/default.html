<!DOCTYPE html>
<html lang="{{ page.lang | default: site.default_lang }}" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    {% include seo.html %}
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        display: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#202124',
                            blue: '#4285F4',
                            red: '#EA4335',
                            yellow: '#FBBC04',
                            green: '#34A853',
                            gray: '#F1F3F4',
                            surface: '#F8F9FA',
                            dark: '#171717',
                            darkbg: '#0a0a0a',
                            darksurface: '#171717'
                        }
                    },
                    borderRadius: {
                        'pill': '9999px',
                        'xl': '1.5rem',
                        '2xl': '2rem',
                        '3xl': '3rem',
                        '4xl': '4rem',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                }
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Scroll Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        /* Article body links → brand blue (blends with main site) */
        .prose a { color: #4285F4; text-decoration: none; font-weight: 500; }
        .prose a:hover { text-decoration: underline; }
        .dark .prose a { color: #8ab4f8; }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>

<body
    class="overflow-x-hidden selection:bg-brand-blue selection:text-white bg-white dark:bg-neutral-950 text-brand-black dark:text-white transition-colors duration-300">

    {% include antigravity_nav.html %}

    {{ content }}

    {% include antigravity_footer.html %}

    <script src="{{ '/assets/js/antigravity.js' | relative_url }}"></script>
</body>

</html>
